{% extends "base.html" %}
{% block content %}
<div class="wrap">
  <h1 class="page-title">学校库</h1>
  <p class="page-sub">{{ total }} 所学校。支持多关键词（空格分隔）、按学段/行政区/性质筛选。</p>

  <button type="button" class="filter-toggle" id="filterToggle"
          aria-expanded="false" aria-controls="filters">
    筛选条件 <span class="filter-count" id="filterCount" hidden></span>
  </button>

  <div class="controls" id="filters" data-open="true">
    <label class="sr-only" for="q">搜索学校</label>
    <input id="q" type="search" placeholder="搜索校名、简称、梯队或关键词，多个词用空格分隔">
    <div class="frow">
      <div class="fgroup"><span class="flabel" id="lv-label">学段</span>
        <span id="f-lv" role="group" aria-labelledby="lv-label" class="contents"></span></div>
      <div class="fgroup"><span class="flabel" id="dist-label">行政区</span>
        <span id="f-dist" role="group" aria-labelledby="dist-label" class="contents"></span></div>
      <div class="fgroup"><span class="flabel" id="type-label">性质</span>
        <span id="f-type" role="group" aria-labelledby="type-label" class="contents"></span></div>
    </div>
  </div>

  <p class="count" id="count" role="status" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
</div>
<script src="{{ base }}assets/schools-data.js"></script>
<script src="{{ base }}assets/search-core.js"></script>
<script src="{{ base }}assets/schools.js"></script>
{% endblock %}
