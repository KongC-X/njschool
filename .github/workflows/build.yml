name: build-and-deploy

# 构建并发布静态站点到 Cloudflare Pages。
# 触发：推送到主分支，或手动执行。
#
# GitHub Pages 已停用（2026-10-31）：其 Custom domain 指向一个已过期为他人所有的
# 域名，github.io 全部 301 过去，实际不可用，且会把收录和分享流量送给对方站点。
# 现在唯一发布目标是 Cloudflare Pages。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 用于判断是否配置了 Cloudflare 凭证。
      # 为空串时，下面的 Cloudflare 部署步骤整段跳过——这样在还没配 secret
      # 的阶段，CI 不会因为「缺 token」而变红，GitHub Pages 照常发布。
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 顺序不能反：index.json 是 build_index.py 生成的，且在 .gitignore 里，
      # 全新 clone 上并不存在。先 validate 会直接 FileNotFoundError。
      - name: 重建索引
        run: python src/build_index.py

      - name: 校验数据（失败即中断）
        run: python src/validate.py

      - name: 构建站点
        env:
          # 站点正式域名，写死不用 vars 变量：
          # 试过 ${{ vars.SITE_BASE_URL || '默认值' }}，但 CI 里读不到变量（构建回退到默认值），
          # 导致 canonical/sitemap 一直指向 github.io。域名已定，直接写死最可靠。
          # 换域名时改这一行即可（全站 canonical / sitemap / robots 都由它派生）。
          NJ_BASE_URL: https://njschool.top
        run: python src/build_website.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 搜索质量闸门：必须跑在构建之后——它校验的是 site/assets 里的真实产物，
      # 不是 tests/fixtures.json 里的 8 所手写样本。
      # 为什么值得卡在这里：「搜不到某所学校」不会让任何页面报错，
      # 构建检查也全绿，只有家长搜的时候才发现。实测曾出现搜「初中」只出 50 条
      # （实际 164 所）、搜「南师附中」本部排在分校后面，都是这类静默失效。
      - name: 前端单测 + 搜索质量闸门
        env:
          # 缺产物必须失败：CI 里静默跳过等于「什么都没查却显示通过」
          NJ_REQUIRE_QUALITY: "1"
        run: node --test tests/*.test.mjs

      # ---- Cloudflare Pages：唯一发布目标 ----
      # 为什么不交给 Cloudflare 自己构建：本项目依赖 Python 3.12 + requirements.txt
      # + make site，CF 的构建镜像版本与依赖缓存都不可控。继续由 Actions 构建、
      # 只把 site/ 上传，换托管方时只需改这一条命令，前面全部不动。
      #
      # 前置（一次性）：CF 面板里建好名为 njschool 的 Pages 项目（Direct Upload）。
      # 不在 CI 里自动创建——wrangler 创建项目是交互式的，CI 里会卡住。
      #
      # CF_API_TOKEN 为空时整段跳过：这样 fork 或本地调试不会因缺凭证而红。
      - name: 部署到 Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch 必须等于 CF 项目的 Production branch，否则会被当成 preview 部署：
          # 产物上传成功、CI 一片绿，但线上（production）永远是旧内容。
          # 这个项目创建时 Production branch 是默认的 main，而仓库分支是 master，
          # 曾因此连续三次「构建成功但线上没变」——日志里只会写
          # "Deployment alias URL: https://master.njschool.pages.dev"。
          # 若以后把 CF 的 Production branch 改成 master，这里也要跟着改成 master。
          command: pages deploy site --project-name=njschool --branch=main --commit-dirty=true
