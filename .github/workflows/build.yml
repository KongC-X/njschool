name: build-and-deploy

# 构建并发布静态站点。
# 触发：推送到主分支，或手动执行。
# 站点基址由仓库信息推导，无需手工维护 sitemap 占位符。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 顺序不能反：index.json 是 build_index.py 生成的，且在 .gitignore 里，
      # 全新 clone 上并不存在。先 validate 会直接 FileNotFoundError。
      - name: 重建索引
        run: python src/build_index.py

      - name: 校验数据（失败即中断）
        run: python src/validate.py

      - name: 构建站点
        env:
          # 站点**实际可访问**的地址，必须与 Pages 的有效入口一致。
          # 历史教训：曾设成 www.ruimengmeng.cn/njschool（域名过期被他人注册），
          # GitHub 认领了该域名 → github.io 全部 301 过去，而对方是一个影视站，
          # 结果 560 个页面一个都到不了，canonical/sitemap 全指向别人的站。
          # 现在回退到 github.io；将来有自有域名时，改仓库 Settings → Variables
          # 的 SITE_BASE_URL 覆盖即可，不必动代码。
          NJ_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://kongc-x.github.io/njschool' }}
        run: python src/build_website.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 搜索质量闸门：必须跑在构建之后——它校验的是 site/assets 里的真实产物，
      # 不是 tests/fixtures.json 里的 8 所手写样本。
      # 为什么值得卡在这里：「搜不到某所学校」不会让任何页面报错，
      # 构建检查也全绿，只有家长搜的时候才发现。实测曾出现搜「初中」只出 50 条
      # （实际 164 所）、搜「南师附中」本部排在分校后面，都是这类静默失效。
      - name: 前端单测 + 搜索质量闸门
        env:
          # 缺产物必须失败：CI 里静默跳过等于「什么都没查却显示通过」
          NJ_REQUIRE_QUALITY: "1"
        run: node --test tests/*.test.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
